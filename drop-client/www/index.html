<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0, viewport-fit=cover">
    <title>Drop — AirSync Mobile</title>
    <!-- Google Fonts + modern fallback -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <!-- jsQR library for QR scanning -->
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --bg-deep: #0a0a12;
            --bg-elevated: #11111f;
            --bg-card: rgba(18, 18, 30, 0.85);
            --neon-cyan: #0ff0fc;
            --neon-magenta: #f0f;
            --neon-purple: #c084fc;
            --neon-blue: #3b82f6;
            --neon-pink: #ff66cc;
            --glass-edge: rgba(255, 255, 255, 0.08);
            --text-dim: #b0b0d0;
            --text-bright: #f0f0ff;
            --success-glow: #00e5a0;
            --error-glow: #ff3a6f;
        }

        body {
            background: radial-gradient(circle at 20% 30%, #0c0c1a, #030307);
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
            color: var(--text-bright);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        .container {
            max-width: 520px;
            width: 100%;
            margin: 0 auto;
            filter: drop-shadow(0 20px 35px rgba(0, 0, 0, 0.6));
        }

        /* glassmorphic card with futuristic borders */
        .status-card {
            background: var(--bg-card);
            backdrop-filter: blur(16px);
            border-radius: 48px 32px 48px 32px;
            border: 1px solid var(--glass-edge);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(0, 255, 255, 0.1) inset;
            padding: 28px 22px 38px;
            transition: all 0.3s ease;
        }

        header {
            text-align: center;
            margin-bottom: 2rem;
        }

        header h1 {
            font-size: 3.2rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--neon-cyan), var(--neon-magenta));
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            letter-spacing: -1px;
            filter: drop-shadow(0 0 12px rgba(0, 255, 255, 0.5));
        }

        header p {
            font-size: 0.85rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: 500;
            color: var(--text-dim);
            margin-top: 6px;
            border-top: 1px dashed rgba(255, 255, 255, 0.2);
            display: inline-block;
            padding-top: 8px;
        }

        /* modern input group */
        .ip-info {
            margin-bottom: 1.8rem;
        }

        .label {
            font-size: 0.7rem;
            font-weight: 600;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: var(--neon-cyan);
            display: block;
            margin-bottom: 12px;
        }

        .neon-input {
            width: 100%;
            background: rgba(0, 0, 0, 0.6);
            border: 1.5px solid rgba(0, 255, 255, 0.4);
            border-radius: 34px;
            padding: 14px 20px;
            font-family: 'Space Mono', monospace;
            font-size: 1rem;
            color: var(--text-bright);
            outline: none;
            transition: all 0.2s;
            backdrop-filter: blur(4px);
        }

        .neon-input:focus {
            border-color: var(--neon-cyan);
            box-shadow: 0 0 12px rgba(0, 255, 255, 0.6);
        }

        /* button styles — modern gradient + cyber */
        .connect-btn, .action-btn, .scan-qr-btn, .disconnect-btn {
            width: 100%;
            border: none;
            font-weight: 700;
            font-size: 1rem;
            padding: 14px 18px;
            border-radius: 60px;
            font-family: 'Inter', sans-serif;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: 0.2s linear;
            margin-bottom: 12px;
            background: linear-gradient(90deg, #1e2a5e, #0f172f);
            color: white;
            border: 1px solid rgba(0, 255, 255, 0.2);
        }

        .connect-btn {
            background: linear-gradient(95deg, #0f2b3d, #180d3a);
            box-shadow: 0 4px 14px rgba(0, 255, 255, 0.2);
        }

        .connect-btn:active {
            transform: scale(0.97);
        }

        .scan-qr-btn {
            background: rgba(20, 20, 40, 0.8);
            backdrop-filter: blur(20px);
            border: 1px solid var(--neon-purple);
            color: var(--neon-purple);
        }

        .action-btn {
            background: linear-gradient(115deg, #00c6a7, #a855f7);
            border: none;
            font-weight: 800;
            letter-spacing: 1px;
        }

        .disconnect-btn {
            background: rgba(50, 20, 40, 0.8);
            border: 1px solid #ff3a6f;
            color: #ff99bb;
            margin-top: 8px;
        }

        /* upload zone — modern glass + drag */
        .upload-zone {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 40px;
            padding: 28px 12px;
            text-align: center;
            border: 2px dashed rgba(0, 255, 255, 0.4);
            transition: all 0.2s;
            margin-bottom: 20px;
            cursor: pointer;
        }

        .upload-zone.drag-over {
            border-color: var(--neon-magenta);
            background: rgba(255, 0, 255, 0.05);
            box-shadow: 0 0 28px rgba(255, 0, 255, 0.2);
        }

        .upload-icon-circle {
            width: 70px;
            height: 70px;
            background: linear-gradient(145deg, #1e1a3a, #00000040);
            border-radius: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 18px;
            font-size: 2.2rem;
            border: 1px solid var(--neon-cyan);
        }

        .file-label {
            font-weight: 600;
            margin: 12px 0 8px;
            display: block;
            font-size: 1rem;
        }

        #file-input {
            display: none;
        }

        .client-status {
            background: rgba(0, 0, 0, 0.5);
            border-radius: 50px;
            padding: 12px;
            text-align: center;
            font-size: 0.85rem;
            font-family: 'Space Mono', monospace;
            margin: 16px 0;
            border-left: 6px solid var(--neon-cyan);
        }

        .downloads-section {
            background: rgba(0, 0, 0, 0.4);
            border-radius: 32px;
            padding: 18px 12px;
            backdrop-filter: blur(8px);
            margin-top: 1rem;
        }

        .file-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 12px;
        }

        .remote-file-item {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 24px;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid rgba(0, 255, 255, 0.2);
            transition: 0.1s;
        }

        .file-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .file-name {
            font-weight: 600;
            font-size: 0.9rem;
        }

        .file-size {
            font-size: 0.7rem;
            color: #aaa;
            font-family: monospace;
        }

        .download-file-btn {
            background: none;
            border: 1px solid var(--neon-cyan);
            border-radius: 40px;
            padding: 8px 18px;
            color: var(--neon-cyan);
            font-weight: 600;
            font-size: 0.8rem;
            cursor: pointer;
            transition: 0.1s;
        }

        /* scanner overlay modal */
        .scanner-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            backdrop-filter: blur(12px);
            z-index: 1000;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        #scanner-video {
            width: 90%;
            max-width: 380px;
            border-radius: 48px;
            border: 2px solid cyan;
            box-shadow: 0 0 40px rgba(0, 255, 255, 0.5);
            object-fit: cover;
            aspect-ratio: 4/3;
        }

        .scanner-window {
            position: relative;
            width: 240px;
            height: 240px;
            margin-top: -200px;
            border: 2px solid var(--neon-magenta);
            border-radius: 28px;
        }

        .scanner-line {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: cyan;
            animation: scan 2s infinite linear;
            box-shadow: 0 0 12px cyan;
        }

        @keyframes scan {
            0% { top: 0%; }
            50% { top: 98%; }
            100% { top: 0%; }
        }

        .scanner-controls {
            margin-top: 2rem;
            text-align: center;
        }

        .hint {
            font-size: 0.7rem;
            text-align: center;
            color: #aaa;
            margin: 10px 0;
        }

        /* responsive touches */
        button:active {
            opacity: 0.85;
        }

        @media (max-width: 480px) {
            .status-card {
                padding: 20px 16px 30px;
            }
            header h1 {
                font-size: 2.6rem;
            }
        }
    </style>
</head>
<body>
<div class="container mobile-only">
    <div class="status-card">
        <header>
            <h1>DROP</h1>
            <p>✦ Instant AirSync ✦</p>
        </header>

        <main>
            <!-- client main view container -->
            <div id="client-view" style="width:100%;">
                <!-- setup panel -->
                <div id="client-setup-view">
                    <div class="ip-info">
                        <span class="label">🌐 PEER SERVER ADDRESS</span>
                        <input type="text" id="server-url-input" class="neon-input" placeholder="192.168.1.5:5000" value="">
                    </div>
                    <div class="setup-actions">
                        <button id="connect-btn" class="connect-btn">⚡ CONNECT NOW</button>
                        <button id="start-scan-btn" class="scan-qr-btn">📡 SCAN QR CODE</button>
                        <p class="hint">Enter IP:Port or scan from PC screen</p>
                    </div>
                </div>

                <!-- connected panel: uploads + files from PC -->
                <div id="client-upload-view" style="display: none;">
                    <div class="upload-zone" id="drop-zone">
                        <div class="upload-icon-circle">
                            <span class="upload-icon">⬆️🚀</span>
                        </div>
                        <span class="label">● LIVE CONNECTION</span>
                        <span id="file-label" class="file-label">Tap to choose files</span>
                        <input type="file" id="file-input" multiple>
                    </div>
                    
                    <div class="client-actions">
                        <button id="upload-btn" class="action-btn">📤 UPLOAD FILES</button>
                    </div>

                    <div id="client-status" class="client-status">✓ STANDBY · SYNC READY</div>
                    
                    <div id="client-downloads-section" class="downloads-section">
                        <h2 style="font-size: 0.85rem; color: var(--neon-magenta); display: flex; gap: 8px; align-items: center;">📁 PC LIBRARY <span style="font-size:10px;">(receive)</span></h2>
                        <div id="remote-file-list" class="file-list">
                            <div style="text-align:center; padding:1rem; opacity:0.6;">fetching files...</div>
                        </div>
                    </div>

                    <button id="disconnect-btn" class="disconnect-btn">🔌 DISCONNECT</button>
                </div>
            </div>

            <!-- scanner overlay (QR) -->
            <div id="scanner-overlay" class="scanner-overlay">
                <video id="scanner-video" playsinline></video>
                <div class="scanner-window">
                    <div class="scanner-line"></div>
                </div>
                <div class="scanner-controls">
                    <button id="close-scanner-btn" class="disconnect-btn" style="background:#000000aa;">✖ CANCEL SCAN</button>
                </div>
                <canvas id="scanner-canvas" style="display:none;"></canvas>
            </div>
        </main>
    </div>
</div>

<script src="mobile.js"></script>
</body>
</html>
