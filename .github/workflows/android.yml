name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: drop-client/package-lock.json

      - name: Install drop-client dependencies
        working-directory: drop-client
        run: npm ci

      - name: Set up Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant Gradle execute permission
        working-directory: drop-client/android
        run: chmod +x gradlew

      - name: Build debug APK
        working-directory: drop-client/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: drop-android-debug
          path: drop-client/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
