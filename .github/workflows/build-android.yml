name: Build Android APK

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: drop-client/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install drop-client dependencies
        working-directory: drop-client
        run: npm ci

      - name: Sync Capacitor
        working-directory: drop-client
        run: npx cap sync android

      - name: Grant execute permission for gradlew
        working-directory: drop-client/android
        run: chmod +x gradlew

      - name: Build Debug APK
        working-directory: drop-client/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: drop-debug
          path: drop-client/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
