name: Build Android APK

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        cache: 'npm'
    
    - name: Setup Java
      uses: actions/setup-java@v3
      with:
        java-version: '11'
        distribution: 'temurin'
    
    - name: Setup Android SDK
      uses: android-actions/setup-android@v2
      with:
        api-levels: '34'
        ndk-version: '26.1.10909125'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Navigate to drop-client
      run: cd drop-client && npm ci
    
    - name: Sync Capacitor
      run: |
        cd drop-client
        npx cap sync android
    
    - name: Grant execute permission for gradlew
      run: |
        cd drop-client/android
        chmod +x gradlew
    
    - name: Build APK (Debug)
      run: |
        cd drop-client/android
        ./gradlew assembleDebug
    
    - name: Build APK (Release)
      run: |
        cd drop-client/android
        ./gradlew assembleRelease
      continue-on-error: true
    
    - name: Upload Debug APK
      uses: actions/upload-artifact@v3
      with:
        name: drop-debug
        path: drop-client/android/app/build/outputs/apk/debug/app-debug.apk
    
    - name: Upload Release APK
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: drop-release
        path: drop-client/android/app/build/outputs/apk/release/app-release-unsigned.apk
      continue-on-error: true
    
    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: |
          drop-client/android/app/build/outputs/apk/debug/app-debug.apk
          drop-client/android/app/build/outputs/apk/release/app-release-unsigned.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
