<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drop Chat</title>
    <link rel="stylesheet" href="chat-style.css">
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
</head>
<body>
    <div class="chat-container">
        <!-- Floating Conversations Button -->
        <button class="conversations-btn" id="conversations-btn" title="View Conversations">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                <circle cx="12" cy="12" r="1"></circle>
                <circle cx="19" cy="12" r="1"></circle>
                <circle cx="5" cy="12" r="1"></circle>
            </svg>
            <span>Conversations</span>
        </button>

        <!-- Conversations Modal -->
        <div class="conversations-modal" id="conversations-modal">
            <div class="modal-backdrop" id="conversations-backdrop"></div>
            <div class="conversations-modal-content">
                <div class="modal-header">
                    <h2>💬 Conversations</h2>
                    <button class="close-btn" id="close-conversations-modal">&times;</button>
                </div>
                <div class="search-box">
                    <input type="text" id="search-input" placeholder="Search conversations...">
                </div>
                <div class="conversations-list" id="conversations-list">
                    <div class="empty-state">No conversations yet</div>
                </div>
            </div>
        </div>

        <!-- Main Chat Area (Full Width) -->
        <main class="chat-main chat-main-fullwidth">
            <!-- Chat Header -->
            <div class="chat-header">
                <div class="chat-header-left">
                    <div class="avatar-large" id="header-avatar"></div>
                    <div class="header-info">
                        <h2 class="chat-title" id="chat-title">Select a conversation</h2>
                        <p class="chat-subtitle" id="chat-subtitle">No messages yet</p>
                    </div>
                </div>
                <div class="header-actions">
                    <button class="icon-btn" id="info-btn" title="Info">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                            <circle cx="12" cy="12" r="10"></circle>
                            <line x1="12" y1="16" x2="12" y2="12"></line>
                            <line x1="12" y1="8" x2="12.01" y2="8"></line>
                        </svg>
                    </button>
                </div>
            </div>

            <!-- Messages Area -->
            <div class="messages-container" id="messages-container">
                <div class="empty-chat">
                    <div class="empty-icon">💬</div>
                    <p>Select a conversation to start chatting</p>
                </div>
            </div>

            <!-- Typing Indicator -->
            <div class="typing-indicator" id="typing-indicator" style="display: none;">
                <span></span>
                <span></span>
                <span></span>
            </div>

            <!-- Input Area -->
            <div class="input-area">
                <button class="attachment-btn" id="attachment-btn" title="Attach file">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                        <path d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 0 19.8 4.3M22 12.5a10 10 0 0 0-19.8-4.2"></path>
                    </svg>
                </button>
                
                <div class="input-wrapper">
                    <textarea id="message-input" class="message-input" placeholder="Type a message..." rows="1"></textarea>
                </div>

                <button class="send-btn" id="send-btn" title="Send">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M16.6915026,12.4744748 L3.50612381,13.2599618 C3.19218622,13.2599618 3.03521743,13.4170592 3.03521743,13.5741566 L1.15159189,20.0151496 C0.8376543,20.8006365 0.99,21.89 1.77946707,22.52 C2.41,22.99 3.50612381,23.1 4.13399899,22.8429026 L21.714504,14.0454487 C22.6563168,13.5741566 23.1272231,12.6315722 22.9702544,11.6889879 L4.13399899,1.16346272 C3.34915502,0.9 2.40734225,1.00636533 1.77946707,1.4776575 C0.994623095,2.10604706 0.837654326,3.0486314 1.15159189,3.99021575 L3.03521743,10.4312088 C3.03521743,10.5883061 3.19218622,10.7454035 3.50612381,10.7454035 L16.6915026,11.5308905 C16.6915026,11.5308905 17.1624089,11.5308905 17.1624089,12.0021827 C17.1624089,12.4744748 16.6915026,12.4744748 16.6915026,12.4744748 Z"></path>
                    </svg>
                </button>
            </div>
        </main>

        <!-- User List Sidebar (can be toggled) -->
        <aside class="users-sidebar" id="users-sidebar">
            <div class="sidebar-header">
                <h3>Active Users</h3>
                <button class="close-btn" id="close-users-btn">&times;</button>
            </div>
            <div class="users-list" id="users-list"></div>
        </aside>
    </div>

    <!-- Username Modal -->
    <div class="modal" id="username-modal">
        <div class="modal-content">
            <h2>Welcome to Drop Chat</h2>
            <p>Enter your username to join</p>
            <p style="font-size: 0.85rem; color: #888; margin-top: 10px;">💚 Messages are end-to-end encrypted</p>
            <input type="text" id="username-input" placeholder="Your username" maxlength="20">
            <button class="btn-primary" id="join-btn">Join Chat</button>
        </div>
    </div>

    <script src="chat-encryption.js"></script>
    <script src="chat.js"></script>
</body>
</html>
